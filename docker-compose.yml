services:
  # MySQL 8 Database
  db:
    image: mysql:8.0
    container_name: equipment_reservation_system_db
    restart: always
    command: --skip-name-resolve
    environment:
      MYSQL_DATABASE: equipment_reservation_system
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    networks:
      - app_network

  # Laravel API Backend (PHP-FPM)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: equipment_reservation_system_backend
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=equipment_reservation_system
      - DB_USERNAME=root
      - DB_PASSWORD=root_password
    depends_on:
      - db
    networks:
      - app_network

  # Dedicated Nginx Webserver
  webserver:
    image: nginx:alpine
    container_name: equipment_reservation_system_webserver
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - app_network

  # Vue 3 Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: equipment_reservation_system_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - webserver
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  db_data: